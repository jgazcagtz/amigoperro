<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Setup - Amigo Perro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1c7d54, #b6956a);
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .setup-container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
        }
        
        .setup-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .setup-header h1 {
            color: #1c7d54;
            margin-bottom: 0.5rem;
        }
        
        .setup-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .form-group label {
            font-weight: 600;
            color: #333;
        }
        
        .form-group input {
            padding: 0.8rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #1c7d54;
        }
        
        .btn {
            background: linear-gradient(135deg, #1c7d54, #25D366);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            font-weight: 500;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .credentials {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            border-left: 4px solid #1c7d54;
        }
        
        .credentials h4 {
            margin: 0 0 0.5rem 0;
            color: #1c7d54;
        }
        
        .credentials p {
            margin: 0.25rem 0;
            font-family: monospace;
            background: white;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="setup-container">
        <div class="setup-header">
            <h1>🐾 Admin Setup</h1>
            <p>Configuración del Administrador de Amigo Perro</p>
        </div>
        
        <div class="setup-form">
            <div class="form-group">
                <label for="admin-email">Email del Administrador</label>
                <input type="email" id="admin-email" value="gascagtz@gmail.com" required>
            </div>
            
            <div class="form-group">
                <label for="admin-password">Contraseña del Administrador</label>
                <input type="password" id="admin-password" value="Espuelas8" required>
            </div>
            
            <div class="form-group">
                <label for="admin-name">Nombre del Administrador</label>
                <input type="text" id="admin-name" value="Administrador Amigo Perro" required>
            </div>
            
            <button class="btn" onclick="createAdmin()" id="create-btn">
                Crear Administrador
            </button>
        </div>
        
        <div id="status"></div>
        
        <div id="credentials" class="credentials" style="display: none;">
            <h4>Credenciales del Administrador</h4>
            <p><strong>Email:</strong> <span id="cred-email"></span></p>
            <p><strong>Contraseña:</strong> <span id="cred-password"></span></p>
            <p><strong>UID:</strong> <span id="cred-uid"></span></p>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB0AxTASTitXDaf69ZJm9q4YruFvo2ESEo",
            authDomain: "amigo-perro-bf18c.firebaseapp.com",
            projectId: "amigo-perro-bf18c",
            storageBucket: "amigo-perro-bf18c.firebasestorage.app",
            messagingSenderId: "96112966515",
            appId: "1:96112966515:web:f782e3c7b6904f80096306",
            measurementId: "G-54876N45ZC"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.createAdmin = async function() {
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;
            const name = document.getElementById('admin-name').value;
            const statusDiv = document.getElementById('status');
            const createBtn = document.getElementById('create-btn');
            const credentialsDiv = document.getElementById('credentials');

            if (!email || !password || !name) {
                showStatus('Por favor completa todos los campos', 'error');
                return;
            }

            createBtn.disabled = true;
            createBtn.textContent = 'Creando...';
            showStatus('Creando usuario administrador...', 'info');

            try {
                // Create admin user account
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                
                // Save admin data to Firestore
                await setDoc(doc(db, 'users', userCredential.user.uid), {
                    name: name,
                    email: email,
                    phone: '+52 55 2720 4437',
                    userType: 'admin',
                    isVerified: true,
                    isSuperAdmin: true,
                    termsAccepted: true,
                    privacyAccepted: true,
                    createdAt: new Date(),
                    uid: userCredential.user.uid
                });

                showStatus('¡Administrador creado exitosamente!', 'success');
                
                // Show credentials
                document.getElementById('cred-email').textContent = email;
                document.getElementById('cred-password').textContent = password;
                document.getElementById('cred-uid').textContent = userCredential.user.uid;
                credentialsDiv.style.display = 'block';
                
                console.log('Admin user created successfully!');
                console.log('Admin Email:', email);
                console.log('Admin Password:', password);
                console.log('Admin UID:', userCredential.user.uid);

            } catch (error) {
                console.error('Error creating admin user:', error);
                showStatus(`Error: ${error.message}`, 'error');
            } finally {
                createBtn.disabled = false;
                createBtn.textContent = 'Crear Administrador';
            }
        };

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
        }
    </script>
</body>
</html>
